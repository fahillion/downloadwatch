name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t downloadwatch:ci .
      - name: Smoke test (demo mode, read-only root, health check)
        run: |
          docker run -d --name dw -p 8090:8090 -e DEMO=true --read-only --tmpfs /tmp --cap-drop ALL downloadwatch:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8090/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8090/api/summary | grep -q '"all"'
          docker logs dw
