# Push a tag like v0.2.0 to publish ghcr.io/<owner>/downloadwatch:<version> and :latest (amd64 + arm64),
# and a GitHub Release with the tested Windows zip and the changelog notes.
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/downloadwatch
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build the Windows zip
        run: python scripts/build_windows.py
      - name: Install, check, upgrade and uninstall
        shell: powershell
        run: .github/scripts/test-windows-install.ps1 -Zip (Get-ChildItem dist/*.zip).FullName
      - name: Release notes from CHANGELOG.md
        shell: python
        run: |
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(version) + r"\b.*?\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          body = (m.group(1).strip() if m else "See CHANGELOG.md.") + (
              "\n\n**Docker:** `docker pull ghcr.io/fahillion/downloadwatch:" + version + "`"
              "\n\n**Windows (no Docker):** download `DownloadWatch-" + version + "-windows-x64.zip` below, unzip, "
              "and follow README-Windows.txt (double-click Try-Demo.cmd to try it first).")
          open("release-notes.md", "w", encoding="utf-8").write(body)
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 \
            --title "DownloadWatch for Plex ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag
